name: Code health secret scan
description: >
  Scan git history for committed credentials with a pinned, checksum-verified
  gitleaks binary. Findings are redacted in the log. Check out with
  fetch-depth 0 so the whole history is scanned.
inputs:
  version:
    description: gitleaks release to use.
    default: "8.30.1"
  log-opts:
    description: Extra `git log` options, e.g. a commit range. Empty scans all history.
    default: ""
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) platform=linux_x64 ;;
          Linux-aarch64) platform=linux_arm64 ;;
          *) echo "::error::secret-scan supports Linux runners only"; exit 1 ;;
        esac
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::Shallow checkout: only fetched commits are scanned. Use actions/checkout with fetch-depth: 0."
        fi
        dir="$RUNNER_TEMP/gitleaks"
        mkdir -p "$dir" && cd "$dir"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        tarball="gitleaks_${VERSION}_${platform}.tar.gz"
        curl -fsSLO "$base/$tarball"
        curl -fsSLO "$base/gitleaks_${VERSION}_checksums.txt"
        grep " ${tarball}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "$tarball" gitleaks
        echo "$dir" >> "$GITHUB_PATH"
    - name: Scan for secrets
      shell: bash
      env:
        LOG_OPTS: ${{ inputs.log-opts }}
      run: |
        args=(git --redact --no-banner --exit-code 1)
        if [ -n "$LOG_OPTS" ]; then args+=(--log-opts "$LOG_OPTS"); fi
        if gitleaks "${args[@]}" .; then
          echo "- Secret scan — no leaks found" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- Secret scan — **leaks found**; see the job log (values redacted)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
