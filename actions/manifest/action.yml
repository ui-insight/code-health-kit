name: Code health manifest
description: Check that the repository's .code-health.toml is present and valid.
inputs:
  root:
    description: Repository root that holds .code-health.toml.
    default: "."
runs:
  using: composite
  steps:
    - name: Check .code-health.toml
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/check_manifest.py" "$ROOT"
      env:
        ROOT: ${{ inputs.root }}
