# Add to pyproject.toml. Append "C901" to your existing [tool.ruff.lint] select
# list rather than replacing it.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
# Complexity ratchet: new code stays at 20 or below. Ruff has no per-file
# limit, so existing functions over 20 carry `# noqa: C901` on their def line
# (scripts/bootstrap_caps.py lists them). Remove a marker once its function is
# refactored under the limit.
max-complexity = 20
